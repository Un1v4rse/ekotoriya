<!-- Заголовок раздела + хлебные крошки в aspro-стиле оригинала: h1 (на разделах
     — со счётчиком товаров catalog_view.total с живым предфильтром) и цепочка
     Главная / Каталог / <раздел> с микроразметкой BreadcrumbList. -->
<div class="maxwidth-theme">
    <div class="topic">
        <div class="topic__inner">
            <div class="topic__heading">
                <h1 id="pagetitle">{{ page.h1 or page.title }}</h1>
                {% if catalog_view is defined and catalog_view.section and catalog_view.total %}
                <span class="element-count-wrapper"><span class="element-count muted font_xs rounded3">{{ catalog_view.total }}</span></span>
                {% endif %}
            </div>
        </div>
    </div>
    <div class="breadcrumbs" id="navigation" itemscope itemtype="https://schema.org/BreadcrumbList">
        <span itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
            <a href="/" itemprop="item"><span itemprop="name">Главная</span></a>
            <meta itemprop="position" content="1" />
        </span>
        <span class="separator">-</span>
        {% if (page.url or '') == '/catalog/' %}
        <span itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
            <span itemprop="name">Каталог</span>
            <meta itemprop="position" content="2" />
        </span>
        {% else %}
        <span itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
            <a href="/catalog/" itemprop="item"><span itemprop="name">Каталог</span></a>
            <meta itemprop="position" content="2" />
        </span>
        <span class="separator">-</span>
        <span itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
            <span itemprop="name">{{ page.h1 or page.title }}</span>
            <meta itemprop="position" content="3" />
        </span>
        {% endif %}
    </div>
</div>
