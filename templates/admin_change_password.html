<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Смена пароля — Экотория</title>
    <style>
        :root {
            --bg: #f4f4f8;
            --card: #fff;
            --accent: #b49d84;
            --accent-dark: #9a8269;
            --text: #333;
            --border: #ddd;
            --danger: #c00;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .pwd-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }
        .pwd-card h1 { margin: 0 0 0.3rem; font-size: 1.35rem; }
        .pwd-card .sub { margin: 0 0 1.4rem; color: #777; font-size: 0.9rem; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.3rem; }
        input[type="password"] {
            width: 100%;
            padding: 0.55rem 0.7rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }
        input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
        .hint { font-size: 0.8rem; color: #888; margin: -0.7rem 0 1rem; }
        button {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: 0;
            padding: 0.65rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: var(--accent-dark); }
        .error {
            background: #fdecea;
            color: var(--danger);
            border: 1px solid #f5c6c0;
            border-radius: 6px;
            padding: 0.5rem 0.7rem;
            font-size: 0.88rem;
            margin-bottom: 1rem;
        }
        .back { display: block; text-align: center; margin-top: 1rem; font-size: 0.85rem; color: var(--accent-dark); }
    </style>
</head>
<body>
    <form class="pwd-card" method="post" action="/admin/change-password">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <h1>🔑 Смена пароля</h1>
        <p class="sub">Задайте новый пароль для входа в админку</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <label for="old_password">Текущий пароль</label>
        <input type="password" id="old_password" name="old_password" autocomplete="current-password" required autofocus>
        <label for="new_password">Новый пароль</label>
        <input type="password" id="new_password" name="new_password" autocomplete="new-password" required>
        <div class="hint">Минимум 8 символов.</div>
        <label for="repeat_password">Новый пароль ещё раз</label>
        <input type="password" id="repeat_password" name="repeat_password" autocomplete="new-password" required>
        <button type="submit">Сохранить пароль</button>
        <a class="back" href="/admin">← Вернуться в админку</a>
    </form>
</body>
</html>
