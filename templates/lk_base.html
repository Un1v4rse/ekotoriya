<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site.name or 'Экотория' }}{% endblock %}</title>
<link rel="stylesheet" href="/theme.css">
<style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .lk-header { border-bottom: 1px solid #eee; background: var(--theme-card-bg, #fff); }
    .lk-header .wrap { max-width: 1100px; margin: 0 auto; padding: 0.9rem 1rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .lk-logo { font-family: var(--theme-heading-font, sans-serif); font-size: 1.25rem; font-weight: 700; color: var(--theme-text, #333); text-decoration: none; }
    .lk-nav { margin-left: auto; display: flex; align-items: center; gap: 0.9rem; flex-wrap: wrap; }
    .lk-nav a { color: var(--theme-link, #9a8269); text-decoration: none; font-size: 0.95rem; }
    .lk-nav a:hover { text-decoration: underline; }
    .lk-main { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    .lk-main h1 { font-family: var(--theme-heading-font, sans-serif); font-size: 1.6rem; margin: 0 0 1.2rem; }
    .lk-card { background: var(--theme-card-bg, #fff); border: 1px solid #eee; border-radius: var(--theme-border-radius, 8px); padding: 1.2rem 1.4rem; margin-bottom: 1.2rem; }
    .lk-card h2 { font-family: var(--theme-heading-font, sans-serif); font-size: 1.15rem; margin: 0 0 0.9rem; }
    .lk-btn { display: inline-block; background: var(--theme-primary, #b49d84); color: var(--theme-button-text, #fff); border: 0; border-radius: var(--theme-border-radius, 6px); padding: 0.6rem 1.3rem; font-size: 0.95rem; cursor: pointer; text-decoration: none; }
    .lk-btn:hover { background: var(--theme-secondary, #9a8269); }
    .lk-btn.secondary { background: #f1f1f1; color: var(--theme-text, #333); }
    .lk-btn.danger { background: #c00; }
    .lk-input, input[type="text"], input[type="tel"], input[type="email"], input[type="password"], input[type="number"] { width: 100%; padding: 0.6rem 0.75rem; border: 1px solid #ddd; border-radius: var(--theme-border-radius, 6px); font-size: 0.95rem; margin-bottom: 0.7rem; }
    label.lk-label { display: block; font-size: 0.85rem; color: #666; margin-bottom: 0.25rem; }
    .lk-check { display: flex; align-items: flex-start; gap: 0.4rem; font-size: 0.8rem; color: #666; margin: 0.4rem 0 0.8rem; cursor: pointer; }
    .lk-check input { margin-top: 0.15rem; }
    table.lk-table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
    table.lk-table th, table.lk-table td { text-align: left; padding: 0.55rem 0.6rem; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
    table.lk-table th { color: #888; font-weight: 600; font-size: 0.8rem; text-transform: uppercase; }
    .lk-status { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 999px; font-size: 0.78rem; background: #f1f1f1; }
    .lk-status.new { background: #fff3cd; }
    .lk-status.processing { background: #cfe2ff; }
    .lk-status.done { background: #d1e7dd; }
    .lk-status.cancelled { background: #f8d7da; }
    .lk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
    .lk-product { border: 1px solid #eee; border-radius: var(--theme-border-radius, 8px); overflow: hidden; background: #fff; }
    .lk-product img { width: 100%; height: 160px; object-fit: cover; display: block; }
    .lk-product .body { padding: 0.7rem 0.8rem; }
    .lk-product .name { font-size: 0.88rem; min-height: 2.4em; }
    .lk-product .name a { color: var(--theme-text, #333); text-decoration: none; }
    .lk-product .price { font-weight: 700; margin-top: 0.35rem; }
    .lk-muted { color: #888; font-size: 0.85rem; }
    .lk-msg { padding: 0.7rem 1rem; border-radius: var(--theme-border-radius, 6px); margin-bottom: 1rem; display: none; }
    .lk-msg.ok { display: block; background: #d1e7dd; color: #0f5132; }
    .lk-msg.err { display: block; background: #f8d7da; color: #842029; }
    .lk-row { display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap; }
    .lk-footer { border-top: 1px solid #eee; margin-top: 2rem; padding: 1.2rem 1rem; text-align: center; color: #999; font-size: 0.85rem; }
</style>
</head>
<body>
<header class="lk-header">
    <div class="wrap">
        <a class="lk-logo" href="/">{{ site.name or 'Экотория' }}</a>
        <nav class="lk-nav">
            <a href="/catalog/">Каталог</a>
            <a href="/basket/">Корзина</a>
            {% if customer is defined and customer %}
                <a href="/personal/">Личный кабинет</a>
                <a href="#" id="lk-logout">Выйти</a>
            {% else %}
                <a href="/auth/">Войти</a>
            {% endif %}
        </nav>
    </div>
</header>
<main class="lk-main">
{% block content %}{% endblock %}
</main>
<footer class="lk-footer">
    {{ site.name or 'Экотория' }}{% if site.phone %} · {{ site.phone }}{% endif %}{% if site.email %} · {{ site.email }}{% endif %}
</footer>
<script>
document.getElementById('lk-logout')?.addEventListener('click', async function(e) {
    e.preventDefault();
    await fetch('/api/client/logout', {method: 'POST'});
    location.href = '/';
});
</script>
</body>
</html>
