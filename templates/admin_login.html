<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в админку — Экотория</title>
    <style>
        :root {
            --bg: #f4f4f8;
            --card: #fff;
            --accent: #b49d84;
            --accent-dark: #9a8269;
            --text: #333;
            --border: #ddd;
            --danger: #c00;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }
        .login-card h1 { margin: 0 0 0.3rem; font-size: 1.35rem; }
        .login-card .sub { margin: 0 0 1.4rem; color: #777; font-size: 0.9rem; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.3rem; }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 0.55rem 0.7rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }
        input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
        button {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: 0;
            padding: 0.65rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: var(--accent-dark); }
        .error {
            background: #fdecea;
            color: var(--danger);
            border: 1px solid #f5c6c0;
            border-radius: 6px;
            padding: 0.5rem 0.7rem;
            font-size: 0.88rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <form class="login-card" method="post" action="/admin/login">
        <h1>🛠 Экотория</h1>
        <p class="sub">Вход в панель управления</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <label for="username">Логин</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <button type="submit">Войти</button>
    </form>
</body>
</html>
