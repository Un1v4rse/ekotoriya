<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в админку — Экотория</title>
    <style>
        :root {
            --bg: #f4f4f8;
            --card: #fff;
            --accent: #b49d84;
            --accent-dark: #9a8269;
            --text: #333;
            --border: #ddd;
            --danger: #c00;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }
        .login-card h1 { margin: 0 0 0.3rem; font-size: 1.35rem; }
        .login-card .sub { margin: 0 0 1.4rem; color: #777; font-size: 0.9rem; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.3rem; }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 0.55rem 0.7rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
        }
        .field { margin-bottom: 1rem; }
        .password-wrap { position: relative; }
        .password-wrap input { padding-right: 2.4rem; }
        .toggle-pass {
            position: absolute;
            right: 0.4rem;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: 0;
            cursor: pointer;
            padding: 0.3rem;
            line-height: 0;
            color: #888;
            width: auto;
        }
        .toggle-pass svg { width: 20px; height: 20px; display: block; }
        .toggle-pass:hover { color: var(--accent-dark); }
        /* «Зачёркнутый» глаз, когда пароль открыт: та же иконка + диагональная черта */
        .toggle-pass .eye-slash {
            display: none;
            position: absolute;
            left: 50%;
            top: 50%;
            width: 24px;
            height: 2px;
            background: currentColor;
            transform: translate(-50%, -50%) rotate(-45deg);
            border-radius: 1px;
            pointer-events: none;
        }
        .toggle-pass.showing { color: var(--accent-dark); }
        .toggle-pass.showing .eye-slash { display: block; }
        input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
        button {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: 0;
            padding: 0.65rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: var(--accent-dark); }
        .error {
            background: #fdecea;
            color: var(--danger);
            border: 1px solid #f5c6c0;
            border-radius: 6px;
            padding: 0.5rem 0.7rem;
            font-size: 0.88rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <form class="login-card" method="post" action="/admin/login">
        <h1>🛠 Экотория</h1>
        <p class="sub">Вход в панель управления</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <label for="username">Логин</label>
        <div class="field">
            <input type="text" id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <label for="password">Пароль</label>
        <div class="field password-wrap">
            <input type="password" id="password" name="password" autocomplete="current-password" required>
            <button type="button" class="toggle-pass" id="toggle-pass" title="Показать пароль" aria-label="Показать пароль"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg><span class="eye-slash"></span></button>
        </div>
        <button type="submit">Войти</button>
    </form>
    <script>
        (function () {
            const btn = document.getElementById('toggle-pass');
            const input = document.getElementById('password');
            btn.addEventListener('click', function () {
                const show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                btn.classList.toggle('showing', show);
                btn.title = show ? 'Скрыть пароль' : 'Показать пароль';
                input.focus();
            });
        })();
    </script>
</body>
</html>
