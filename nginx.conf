# nginx-прокси для Экотории (Этап 6.4, AR-8): gzip, кэш статики, TLS-ready.
# Без TLS-сертификатов слушаем 80 порт; для HTTPS раскомментируйте блок server :443
# и положите сертификаты в ./certs (тогда app получит X-Forwarded-Proto и
# FORCE_HTTPS=1 довершит редирект/HSTS на уровне приложения).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 20m;   # лимит upload (в админке 10 МБ, с запасом)

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    upstream ekotoriya_app {
        server app:8000;
    }

    # Кэш статики на диске (проксированные картинки /proxy/image уже
    # отдаются с max-age; здесь — запасной слой).
    proxy_cache_path /var/cache/nginx/ekotoriya levels=1:2
                     keys_zone=ekotoriya:10m inactive=30d max_size=512m;

    server {
        listen 80;
        server_name _;

        root /var/www;

        # Статика — напрямую из тома, без участия Flask
        location /static/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Bitrix-заглушка счётчика конверсий: шаблоны дёргают её POST'ом,
        # статика POST не принимает (405) — проксируем в Flask, там route 200.
        location = /static/bitrix/tools/conversion/ajax_counter.php {
            proxy_pass http://ekotoriya_app;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Кэшированные изображения прокси
        location /proxy/image {
            proxy_pass http://ekotoriya_app;
            proxy_cache ekotoriya;
            proxy_cache_valid 200 30d;
            proxy_cache_key $request_uri;
            expires 30d;
            add_header Cache-Control "public, immutable";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://ekotoriya_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }

    # HTTPS (раскомментировать при наличии сертификатов):
    # server {
    #     listen 443 ssl;
    #     server_name example.com;
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     include /etc/nginx/mime.types;
    #     ... те же location, что выше ...
    # }
}
