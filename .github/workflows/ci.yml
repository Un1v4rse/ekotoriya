# CI (Этап 6.5, TS-5): тесты на каждый push/PR в ветки main/master.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (flake8/ruff — только если конфиг проекта есть)
        run: |
          if ls .flake8 setup.cfg tox.ini .ruff.toml ruff.toml pyproject.toml 2>/dev/null | grep -q .; then
            pip install flake8 ruff
            flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
            ruff check . || true
          else
            echo "Нет конфигурации линтера в проекте — шаг пропущен (TS-5, минимальная сборка)"
          fi

      - name: Tests
        run: python -X utf8 -m pytest tests/ -q
